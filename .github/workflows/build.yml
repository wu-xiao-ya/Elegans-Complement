name: Build

on:
  push:
    branches:
      - main
      - "codex/**"
      - "ci/**"
  pull_request:
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --stacktrace --info build

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/**
            build/tmp/**/patching.log
          if-no-files-found: ignore

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-libs
          path: build/libs/**
          if-no-files-found: error
